name: unibet-event-goals-batch-runner

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs Unibet, une par ligne"
        required: true

jobs:
  batch_runner:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug workspace
        run: |
          pwd
          ls -la
          which python3 || true
          python3 --version || true

      # =========================================================
      # GARDE ICI TON BLOC QUI MARCHE DÉJÀ POUR LE BATCH GOALS
      # =========================================================
      #
      # Exemple :
      # - name: Run goals batch runner
      #   env:
      #     URLS: ${{ github.event.inputs.urls }}
      #   run: |
      #     python3 scrapers/TON_SCRIPT_BATCH.py
      #
      # IMPORTANT :
      # Ce bloc doit produire un fichier batch_summary.json
      # dans un sous-dossier du workspace GitHub.
      #
      # =========================================================

      - name: Find batch summary
        run: |
          echo "Recherche batch_summary.json"
          find . -name "batch_summary.json" -print

      - name: Upload goals batch artifact
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-goals-batch-summary
          path: |
            **/batch_summary.json
          if-no-files-found: error
          retention-days: 7

  acceptance:
    runs-on: self-hosted
    needs: batch_runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download batch summary artifact
        uses: actions/download-artifact@v4
        with:
          name: unibet-event-goals-batch-summary
          path: downloaded_batch

      - name: Debug downloaded files
        run: |
          echo "Fichiers téléchargés :"
          find downloaded_batch -type f -print

      - name: Run goals acceptance
        run: |
          BATCH_FILE="$(find downloaded_batch -name 'batch_summary.json' | head -n 1)"
          if [ -z "$BATCH_FILE" ]; then
            echo "batch_summary.json introuvable"
            exit 1
          fi
          echo "BATCH_FILE=$BATCH_FILE"
          export BATCH_SUMMARY_PATH="$BATCH_FILE"
          python3 scrapers/unibet_event_goals_acceptance.py

      - name: Find acceptance report
        if: always()
        run: |
          find downloaded_batch -name "acceptance_report.json" -print || true
          find . -name "acceptance_report.json" -print || true

      - name: Upload acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-goals-acceptance
          path: |
            **/acceptance_report.json
          if-no-files-found: warn
          retention-days: 7
