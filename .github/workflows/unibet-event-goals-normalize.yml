name: unibet-event-goals-normalize

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["unibet-event-goals-batch", "unibet-event-goals-acceptance"]
    types: [completed]

jobs:
  normalize:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Normalize accepted goals runs
        run: |
          python3 scrapers/unibet_event_goals_normalize_accepted.py
      
      - name: Upload normalized artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-goals-normalized
          path: artifacts/unibet_event_goals_normalized/**
          retention-days: 14
