name: unibet-event-points-parser

on:
  workflow_dispatch:
    inputs:
      event_url:
        description: "URL complète de la page event Unibet NHL"
        required: true
        type: string
      headless:
        description: "Lancer Chromium en headless"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  discovery:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          python3 -m playwright install chromium

      - name: Run points parser
        env:
          UNIBET_EVENT_URL: ${{ inputs.event_url }}
          PW_HEADLESS: ${{ inputs.headless }}
          PW_TIMEOUT_MS: "45000"
          PW_SLOWMO_MS: "0"
        run: |
          python3 scrapers/unibet_event_points_parser_v1.py

      - name: Upload parser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-points-parser-${{ github.run_number }}
          path: artifacts/unibet_event_points_parser_v1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
