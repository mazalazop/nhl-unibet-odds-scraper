name: unibet-event-goals-acceptance

on:
  workflow_dispatch:
    inputs:
      batch_summary_path:
        description: "Chemin vers batch_summary.json"
        required: true
        type: string

jobs:
  run-acceptance:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Python
        run: |
          which python3 || true
          python3 --version || true
          which pip3 || true
          pip3 --version || true

      - name: Run goals acceptance
        env:
          BATCH_SUMMARY_PATH: ${{ github.event.inputs.batch_summary_path }}
        run: |
          python3 scrapers/unibet_event_goals_acceptance.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-goals-acceptance
          path: artifacts/
          retention-days: 7
