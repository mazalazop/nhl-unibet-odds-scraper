name: unibet-event-goals-batch

on:
  workflow_dispatch:
    inputs:
      event_urls:
        description: "URLs event Unibet séparées par virgules"
        required: true
        type: string
      headless:
        description: "Lancer en headless"
        required: true
        default: true
        type: boolean

jobs:
  run-batch:
    runs-on: [self-hosted, macOS, X64, morgan-runner]
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug Python
        run: |
          which python3 || true
          python3 --version || true
          which pip3 || true
          pip3 --version || true
          pwd
          ls -la

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt
          python3 -m playwright install chromium

      - name: Run goals batch
        env:
          UNIBET_EVENT_URLS: ${{ github.event.inputs.event_urls }}
          PW_HEADLESS: ${{ github.event.inputs.headless }}
        run: |
          python3 scrapers/unibet_event_goals_batch_runner.py

      - name: Build acceptance report
        run: |
          LATEST_BATCH_DIR=$(ls -td artifacts/unibet_event_goals_batch_runner/* | head -n 1)
          export BATCH_SUMMARY_PATH="$LATEST_BATCH_DIR/batch_summary.json"
          python3 scrapers/unibet_event_goals_acceptance_report.py

      - name: Build normalized goals json
        run: |
          LATEST_BATCH_DIR=$(ls -td artifacts/unibet_event_goals_batch_runner/* | head -n 1)
          export ACCEPTANCE_REPORT_PATH="$LATEST_BATCH_DIR/acceptance_report.json"
          python3 scrapers/unibet_event_goals_normalize_accepted.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unibet-event-goals-batch
          path: artifacts/
          retention-days: 7
